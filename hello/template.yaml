AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Hello Lambda behind an HTTP API. Encrypted request_key in, response_key + response_value out, both with the vendor's shared AES-256 key

Parameters:
  # Pre-created by an IAM admin so the deploy role needs no iam:*RolePolicy permissions.
  # Each role must allow lambda.amazonaws.com to assume it, carry AWSLambdaBasicExecutionRole
  # for logs, and hold the inline permissions noted below.
  HelloFunctionRoleArn:
    Type: String
    Description: >-
      ARN of the execution role for the main function. Needs:
      secretsmanager:GetSecretValue on secret:empower_care_lambda_encryption/*,
      and dynamodb:PutItem on the empower_care_lambda_encryption-nonce table.
  HelloOpenFunctionRoleArn:
    Type: String
    Description: >-
      ARN of the execution role for the dev-open function. Needs:
      secretsmanager:GetSecretValue on secret:empower_care_lambda_encryption/*.

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Handler: app.handler
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        # One secret per vendor. The X-Vendor-Id header picks which one.
        PAYLOAD_KEY_SECRET_TEMPLATE: empower_care_lambda_encryption/{vendor}/response-key
        PAYLOAD_NONCE_TABLE: !Ref NonceTable

Resources:
  VendorKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: empower_care_lambda_encryption/TEST_VENDOR_UAT/response-key
      Description: Shared AES-256 response key for TEST_VENDOR_UAT. The vendor holds a copy. Never print or log it.
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: key_hex
        # Only 0-9 and a-f are left, so 64 characters is exactly 32 bytes of hex.
        PasswordLength: 64
        ExcludePunctuation: true
        ExcludeUppercase: true
        ExcludeCharacters: ghijklmnopqrstuvwxyz
      Tags:
        - { Key: Name, Value: empower_care_lambda_encryption-vendor-key }
        - { Key: Environment, Value: development }
        - { Key: Owner, Value: empower_care_lambda_encryption }
        - { Key: Project, Value: empower-care }

  NonceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: empower_care_lambda_encryption-nonce
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: nonce_id, AttributeType: S }
      KeySchema:
        - { AttributeName: nonce_id, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: ttl_epoch
        Enabled: true
      Tags:
        - { Key: Name, Value: empower_care_lambda_encryption-nonce }
        - { Key: Environment, Value: development }
        - { Key: Owner, Value: empower_care_lambda_encryption }
        - { Key: Project, Value: empower-care }

  CryptoLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: empower_care_lambda_encryption-payload-crypto
      ContentUri: ../payload-crypto/.build/layer
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: empower_care_lambda_encryption
      CodeUri: src/
      Layers: [!Ref CryptoLayer]
      # Pre-created role (see Parameters). SAM manages no inline policy here.
      Role: !Ref HelloFunctionRoleArn
      Tags:
        Name: empower_care_lambda_encryption
        Environment: development
        Owner: empower_care_lambda_encryption
        Project: empower-care
      Events:
        Hello:
          Type: HttpApi
          Properties:
            Path: /hello
            Method: POST

  HelloOpenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: empower_care_lambda_encryption-open
      Description: DEV ONLY. Seals hello requests and opens replies with the shared key. Invoke only, no API route
      CodeUri: src/
      Handler: dev_open.handler
      Layers: [!Ref CryptoLayer]
      # Pre-created role (see Parameters). SAM manages no inline policy here.
      Role: !Ref HelloOpenFunctionRoleArn
      Tags:
        Name: empower_care_lambda_encryption-open
        Environment: development
        Owner: empower_care_lambda_encryption
        Project: empower-care

Outputs:
  HelloUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/hello"
  OpenFunctionName:
    Value: !Ref HelloOpenFunction
  VendorKeySecretName:
    Value: empower_care_lambda_encryption/TEST_VENDOR_UAT/response-key
